[package]
name = "curtain"
default-run = "curtain"
version = "0.1.0"
description = "Hide any screen in one tap. Keep your machine awake while AI agents work."
authors = ["Naman"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
sysinfo = "0.33"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
rand = "0.8"
dirs = "5"
toml_edit = "0.22"
portable-pty = "0.9"
regex = "1"
uuid = { version = "1", features = ["v4"] }
terminal_size = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen", "NSApplication", "NSResponder", "NSWorkspace", "NSEvent", "NSColor", "NSCursor", "NSGraphics", "NSView", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSNotification", "NSString", "NSArray", "NSError", "NSDictionary", "NSValue"] }
core-foundation = "0.10"
window-vibrancy = "0.6"
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAPublicDefines"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Security_Credentials_UI",
  "Foundation",
] }
window-vibrancy = "0.6"
